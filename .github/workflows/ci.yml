name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Les tests tournent directement en TypeScript via le mode « strip-types »
      # de Node : pas d'étape de compilation, pas de dépendance de test.
      - name: Tests du service de matching
        run: npm run test:backend

      - name: Dépendances de l'app mobile
        working-directory: mobile
        # --legacy-peer-deps : quelques paquets de l'écosystème Expo déclarent
        # des pairs incompatibles entre eux sur ce SDK.
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Tests de l'app mobile
        working-directory: mobile
        run: npm test

      - name: Typage de l'app mobile
        working-directory: mobile
        run: npm run typecheck

      # Le test de fumée lance réellement l'app dans un navigateur : c'est le
      # seul garde-fou contre une erreur qui ne se voit ni au typage ni au
      # bundling — un hook mal utilisé, un import qui explose au montage.
      - name: Navigateur pour le test de fumée
        working-directory: mobile
        run: npx playwright install --with-deps chromium

      - name: Test de fumée (l'app démarre-t-elle ?)
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: cle-factice-pour-le-bundling
        run: npm run fumee
